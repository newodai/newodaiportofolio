<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — newodai</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --text-white: #ffffff;
            --text-muted: #9ca3af;
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-white); font-family: var(--font-family); line-height: 1.6; padding-top: 100px; }

        nav { position: fixed; top: 0; left: 0; width: 100%; padding: 20px 0; background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(16px); z-index: 1000; border-bottom: 1px solid var(--card-border); }
        .nav-container { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; text-decoration: none; color: white; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-white); }

        section { padding: 40px 24px 90px; max-width: 1100px; margin: 0 auto; }
        .section-header { margin-bottom: 48px; }
        .section-title { font-size: 2rem; font-weight: 700; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .section-desc { color: var(--text-muted); font-size: 1rem; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }

        .contact-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.3s; position: relative; }
        .contact-card:hover { border-color: var(--accent-red); }
        .contact-left { display: flex; align-items: center; gap: 16px; }
        .contact-icon { font-size: 1.5rem; color: var(--accent-red); }
        .contact-label { font-size: 0.8rem; color: var(--text-muted); }
        .contact-val { font-weight: 600; }

        .toast { position: absolute; top: -30px; right: 20px; background: var(--accent-red); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.active { opacity: 1; }

        footer { text-align: center; padding: 40px; color: var(--text-muted); border-top: 1px solid var(--card-border); font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="about.html" class="logo">newodai</a>
            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="contact">
        <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-paper-plane"></i> Contact Me</h2>
            <p class="section-desc">Click below to copy my contact details</p>
        </div>
        <div class="grid-2">
            <div class="contact-card" onclick="copyText('8gry', 'toast-1')">
                <span class="toast" id="toast-1">Copied!</span>
                <div class="contact-left">
                    <i class="fa-brands fa-discord contact-icon"></i>
                    <div>
                        <div class="contact-label">Discord</div>
                        <div class="contact-val">8gry</div>
                    </div>
                </div>
                <i class="fa-regular fa-copy" style="color: var(--text-muted);"></i>
            </div>
            <div class="contact-card" onclick="copyText('isglaur@email.com', 'toast-2')">
                <span class="toast" id="toast-2">Copied!</span>
                <div class="contact-left">
                    <i class="fa-solid fa-envelope contact-icon"></i>
                    <div>
                        <div class="contact-label">Email</div>
                        <div class="contact-val">isglaur@email.com</div>
                    </div>
                </div>
                <i class="fa-regular fa-copy" style="color: var(--text-muted);"></i>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 newodai. All rights reserved.</p>
    </footer>

    <script>
        function copyText(text, toastId) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById(toastId);
                toast.classList.add('active');
                setTimeout(() => toast.classList.remove('active'), 2000);
            });
        }
    </script>
</body>
</html>
