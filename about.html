<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>newodai</title>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- FLOATING PILL NAVBAR --- */
        nav {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 8px 20px;
            background: #16181f;
            border: 1px solid #232733;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            margin-top: 10px;
        }

        /* Brand / Logo */
        .brand {
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.3px;
        }

        /* Nav Tab Links Outer Container */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 4px;
            background: #0d0e12;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #1f222e;
        }

        /* Nav Tab Links */
        .nav-links a {
            text-decoration: none;
            color: #8f96a3;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            display: inline-block;
        }

        /* Hover State */
        .nav-links a:hover {
            color: #ffffff;
        }

        /* Active Selected Tab */
        .nav-links a.active {
            background: #232733;
            color: #ffffff;
            font-weight: 600;
        }

        /* Extra Button / Tag on Right (Optional) */
        .nav-extra {
            display: flex;
            align-items: center;
        }

        .btn-status {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 12px;
                padding: 12px;
            }
            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <!-- FLOATING PILL NAVBAR -->
    <nav>
        <!-- Logo -->
        <a href="index.html" class="brand">newodai</a>

        <!-- Middle Pill Tabs -->
        <ul class="nav-links">
            <li><a href="index.html" class="active">Overview</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <!-- Right Side Badge / Action Button -->
        <div class="nav-extra">
            <span class="btn-status"><span class="dot"></span> Online</span>
        </div>
    </nav>

</body>
</html>
